version: 1

scope:
  owners:
    - Banes-dev
  include_forks: false
  include_archived: false
  include_private: true
  exclude_repos: []

languages:
  mode: raw
  weights: {}
  exclude: []
  hide:
    - Objective-C
  hidden_share: other
  max_visible: 8
  other_label: Other

distribution:
  release_assets: true
  clones: true
  views: true

render:
  blocks:
    - stats: [totals, distribution]
  private_bar: true
  languages:
    colors: spectrum
  theme:
    preset: carbon
    accent: amber
  motion: true
  layout: card
  base_path: ghstats/

