<svg class="gs" viewBox="0 0 495 174" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ghstats card for Banes-dev (dark)"><style>.gs .blink{animation:gsblink 1.1s steps(1,end) infinite}@keyframes gsblink{50%{opacity:0}}.gs .pulse{transform-box:fill-box;transform-origin:center;animation:gspulse 2.4s ease-out infinite}@keyframes gspulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}.gsb0 .fade{animation:gsb0fade 0.7s cubic-bezier(.2,.7,.2,1) backwards}@keyframes gsb0fade{from{opacity:0;transform:translateY(4px)}}.gsb0 .fadeslow{animation:gsb0fadeslow 1.2s ease-out backwards}@keyframes gsb0fadeslow{from{opacity:0}}.gsb0 .grow{transform-box:fill-box;transform-origin:0 50%;animation:gsb0grow 1s cubic-bezier(.2,.7,.2,1) backwards}@keyframes gsb0grow{from{transform:scaleX(0)}}.gsb0 .growfast{transform-box:fill-box;transform-origin:0 50%;animation:gsb0growfast 0.4s cubic-bezier(.2,.7,.2,1) backwards}@keyframes gsb0growfast{from{transform:scaleX(0)}}.gsb0 .draw{stroke-dasharray:1;animation:gsb0draw 1.8s cubic-bezier(.4,0,.2,1) backwards}@keyframes gsb0draw{from{stroke-dashoffset:1}}.gsb0 .drop{animation:gsb0drop 0.7s cubic-bezier(.2,.7,.2,1) backwards}@keyframes gsb0drop{from{opacity:0;transform:translateY(-22px)}}.gsb0 .on{animation:gsb0on 0.02s steps(1,end) backwards}@keyframes gsb0on{from{opacity:0}}@media (prefers-reduced-motion: reduce){.gs,.gs *{animation:none!important}}</style>
